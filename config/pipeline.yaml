run:
  timezone: Asia/Shanghai
  output_language: pt-BR
  workspace: workspace
  timeout_sec: 900
  source_search_timeout_sec: 90
  source_download_timeout_sec: 300

sources:
  enabled: [youtube, bilibili, douyin, xiaohongshu, tiktok, facebook, x, instagram, kwai]
  exclude_languages: []
  keywords_file: config/keywords.brazil.yaml
  creators_file: config/creators.example.yaml
  # Which keyword languages go to which platform (see keywords file terms.*)
  platform_language:
    youtube: [pt, en]
    bilibili: [zh-CN, zh, pt]
    douyin: [zh-CN, zh, pt]
    xiaohongshu: [zh-CN, zh]
    tiktok: [pt, en]
    facebook: [en, es, pt]
    x: [pt, en]
    instagram: [pt, en]
    kwai: [pt, en]
  adapters:
    youtube:
      cookies_file: ""
      cookies_from_browser: ""
      js_runtime: ""                 # optional, e.g. node:/absolute/path/to/node
      impersonate: ""                # opt-in only; forcing it can reduce YouTube stability
    bilibili:
      cookies_file: ""              # optional Netscape cookies.txt to improve reliability
      cookies_from_browser: ""       # local-only option, e.g. chrome; keep empty on server
      js_runtime: ""                 # optional, e.g. node:/absolute/path/to/node
      impersonate: ""
    tiktok:
      cookies_file: ""              # optional TikTok cookies.txt for age/region-limited videos
      cookies_from_browser: ""
      js_runtime: ""
      impersonate: auto              # uses curl-cffi when available, otherwise degrades safely
    facebook:
      cookies_file: ""              # Facebook keyword search is not supported; direct URLs can use cookies
      cookies_from_browser: ""
      js_runtime: ""
      impersonate: auto
    x:
      cookies_file: ""
      cookies_from_browser: ""
      js_runtime: ""
      impersonate: auto
    instagram:
      cookies_file: ""
      cookies_from_browser: ""
      js_runtime: ""
      impersonate: auto
    kwai:
      cookies_file: ""
      cookies_from_browser: ""
      js_runtime: ""
      impersonate: auto
    douyin:
      api_base: http://127.0.0.1:8000   # self-hosted Douyin_TikTok_Download_API
      binary: workspace/tool_venvs/f2/bin/f2
      config_file: ""                    # optional private f2 YAML; managed sessions are detected automatically
    xiaohongshu:
      api_base: http://127.0.0.1:5556   # self-hosted XHS-Downloader API mode

discovery:
  max_candidates_per_keyword: 3

selection:
  min_score: 45
  max_source_duration_sec: 900
  min_height: 360
  duplicate_threshold: 0.90
  market_filter:
    enabled: true
    target: brazil_trends

edit:
  render_engine: remotion           # dual-variant overlays/endcards require Remotion
  output_duration_sec: [12, 60]
  max_segments_per_source: 3
  segment_overlap_sec: 3
  layout_mode: original            # original | vertical
  aspect_ratio: "source"
  resolution: [1080, 1920]         # used only when layout_mode=vertical
  default_segment_strategy: auto

localization:
  enabled: true
  target: pt-BR
  krillinai:
    project_dir: workspace/external_tools/KrillinAI
    binary: build/krillinai-cli
    revision: 17c87b0ce59ee937b0658994718c07b9ca98c1d1
    timeout_sec: 1800
    origin_language: auto
    target_language: pt
    caption_source: any
    max_words_per_line: 7
    voice: ""                       # empty uses the provider default; each production run may override it
  # Hook variants for A/B testing; tracking.hook_version selects the active one
  # and is embedded in every UTM link as utm_content=<candidate-id>_<hook-version>.
  hooks:
    A: "Olha só o que aconteceu aqui."
    B: "Você precisa ver isso até o final."
audio:
  source_mode: localize             # normal production delegates subtitle, translation and dubbing to KrillinAI
  source_music_volume: 1.0
  voice_volume: 1.0
  bgm_volume: 0.0                  # fixed BGM is disabled; pt-BR localization uses generated voice only
  bgm_dir: assets/bgm
  bgm_path: ""

remotion:
  render_runner: cli
  promo_duration_sec: 1.5
  overlay_max_width_ratio: 0.18
  mobile_overlay_left_width_ratio: 0.22
  mobile_overlay_right_width_ratio: 0.36
  overlay_margin_h_ratio: 0.03
  overlay_margin_v_ratio: 0.05
  dual_variant:
    enabled: true
    generic_label: 通用版
    facebook_label: FB版
    tu_yi: assets/brand/overlay_tu_yi.jpg
    tu_er: assets/brand/overlay_tu_er.png
    bottom_banner: assets/brand/generic_bottom_banner.jpg
    lv_tu: assets/brand/endcard_portrait_green_v2.png
    lan_tu: assets/brand/endcard_landscape_blue_v2.png
  add_bgm_under_source: false
  content_bgm_volume: 0.0
  endcard_bgm_volume: 0.0
  captions:
    enabled: true
    variants: [通用版, FB版]
    position: bottom
    max_width_ratio: 0.68
    font_size_ratio: 0.034
    safe_inset_ratio: 0.12
    background_opacity: 0.52
    max_lines: 2
    text_color: "#ffffff"
    background_color: "#050505"
    accent_color: "#f2d14b"
  top_badge: ""
  bottom_headline: ""
  bottom_subline: ""
  endcard_cta: ""

aspect_thresholds:
  vertical_min: 0.5
  vertical_max: 0.75
  horizontal_min: 1.6
  horizontal_max: 1.9

mobile_review_format:
  enabled: true
  target_aspect: "3:4"
  target_resolution: [1080, 1440]
  landscape_min_aspect: 1.2
  background: "#000000"

brand:
  default_cta: https://copa.jarg.top/
  default_kit: jaguartv
  kits:
    jaguartv:
      watermark:
        mode: image            # image | text
        image: assets/brand/logo.png
        text: "Jaguar TV"      # fallback when image missing
        position: top_left     # top_left | top_right | bottom_left | bottom_right
        opacity: 0.92
        width: 170
      cover:
        mode: frame            # frame | image
        image: ""              # mode=image: server path or project-relative image
      endcard:
        mode: orientation_image        # generated | image | orientation_image
        image: ""              # mode=image: full-frame 1080x1920 PNG
        portrait_image: assets/brand/endcard_portrait_green_v2.png
        landscape_image: assets/brand/endcard_landscape_blue_v2.png
        title: "Jaguar TV"
        tagline: "O melhor app de TV ao vivo e esportes"
        site: "Jarg.top"
        duration_sec: 1.5
        background: "#04220E"
        accent: "#8CE522"
        features:
          - ["Anti-Freeze", "Estabilidade máxima em dias de jogos"]
          - ["4K Real", "A definição mais nítida do mercado"]
          - ["Futebol Total", "Canais premium 100% liberados"]
          - ["Sinal Raiz", "Servidores dedicados, sem intermediários"]

publishing:
  enabled: true
  timezone: America/Sao_Paulo
  copywriter:
    model: gpt-5.6-terra
    attempts: 3
    timeout_sec: 60
    retry_delay_sec: 0.75
  youtube_category_accounts:
    足球类: jaguartv_vivo
  accounts:
    jaguartv_vivo:
      platform: youtube
      label: jaguartv vivo
      channel_id: UC8gCZXc5wbnjuZeco7qbKug
      channel_key: 8gCZXc5wbnjuZeco7qbKug
      authorized_email: miirandapache@gmail.com
      daily_limit: 3
      schedule_times:
        - "11:00"
        - "15:30"
        - "19:00"
      allowed_source_platforms:
        - tiktok
        - douyin
        - facebook
        - bilibili
        - original
      blocked_source_platforms:
        - youtube
      content_tags:
        - 足球类
      default_privacy_status: public
      enabled: true

storage:
  provider: factory_server
  root: workspace/server_media
  poster_subdir: posters
  public_base_url: https://factory.jarg.top/media
  remote_review_host: 43.134.128.197
  remote_review_user: ubuntu
  remote_review_key: ~/.ssh/jarg_tencent.pem
  remote_review_root: /opt/jaguartv-content-factory-vnext/workspace/server_media/review
  max_upload_bytes: 2147483648
  upload_chunk_bytes: 8388608
  inventory_dir: inventory

trends:
  enabled: true
  pytrends_path: /opt/pytrends
  cron: "0 5 * * *"
  schedule_timezone: Asia/Shanghai
  geo: BR
  keywords: ["futebol Brasil"]
  top_n: 10
  source: google_trends
  scrapling_python: workspace/tool_venvs/scrapling/bin/python
  sync_keywords_group: google_trends_br_daily
  runtime_keywords_file: workspace/runtime/keywords.trends.yaml

features:
  posters: true

compliance:
  require_verified_rights: false
  mode: manual_review
  review_content_risk: [football, sports_highlight, soap_opera, cartoon_kids]

reaction:
  modes: [none, picture_in_picture, split_vertical, side_by_side]
  default_mode: none
  source_volume: 0.72
  reaction_volume: 1.0

tracking:
  # Every rendered video gets one unique link per publish platform:
  #   {base_url}?utm_source={platform}&utm_medium={utm_medium}
  #     &utm_campaign={campaign}&utm_content={candidate-id}_{hook_version}
  base_url: https://copa.jarg.top/baixar-o-app
  utm_medium: organic_social
  campaign: hoje_sports
  hook_version: A

youtube_analytics:
  poll_interval_minutes: 60
  channel_import_interval_minutes: 60
  batch_size: 50
  backfill_rate_limit_per_minute: 6
