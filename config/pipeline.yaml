run:
  timezone: Asia/Shanghai
  output_language: pt-BR
  workspace: workspace
  timeout_sec: 900
  source_search_timeout_sec: 90
  source_download_timeout_sec: 300

sources:
  enabled: [douyin, tiktok, facebook]
  exclude_languages: []
  keywords_file: config/keywords.brazil.yaml
  creators_file: config/creators.example.yaml
  # Which keyword languages go to which platform (see keywords file terms.*)
  platform_language:
    youtube: [pt, en]
    bilibili: [zh-CN, zh, pt]
    douyin: [zh-CN, zh, pt]
    xiaohongshu: [zh-CN, zh]
    tiktok: [pt, en]
    facebook: [en, es, pt]
  adapters:
    youtube:
      cookies_file: ""
      cookies_from_browser: ""
      js_runtime: ""                 # optional, e.g. node:/absolute/path/to/node
    bilibili:
      cookies_file: ""              # optional Netscape cookies.txt to improve reliability
      cookies_from_browser: ""       # local-only option, e.g. chrome; keep empty on server
      js_runtime: ""                 # optional, e.g. node:/absolute/path/to/node
    tiktok:
      cookies_file: ""              # optional TikTok cookies.txt for age/region-limited videos
      cookies_from_browser: ""
      js_runtime: ""
    facebook:
      cookies_file: ""              # Facebook keyword search is not supported; direct URLs can use cookies
      cookies_from_browser: ""
      js_runtime: ""
    douyin:
      api_base: http://127.0.0.1:8000   # self-hosted Douyin_TikTok_Download_API
    xiaohongshu:
      api_base: http://127.0.0.1:5556   # self-hosted XHS-Downloader API mode

discovery:
  max_candidates_per_keyword: 3

selection:
  min_score: 45
  max_source_duration_sec: 1800
  min_height: 360
  duplicate_threshold: 0.90
  market_filter:
    enabled: true
    target: brazil_trends

source_outro_trim:
  enabled: true
  scan_tail_sec: 15
  min_trim_sec: 2
  max_trim_sec: 12
  min_confidence: 0.72
  preserve_if_unsure: true
  ocr_enabled: true
  audio_guard_enabled: true
  save_evidence_frames: true
  promo_terms:
    zh:
      - 关注
      - 私信
      - 微信
      - 公众号
      - 下载
      - 扫码
      - 二维码
      - 加群
    pt:
      - siga
      - seguir
      - inscreva-se
      - baixe
      - link na bio
      - compartilhe
      - whatsapp
      - promoção
    en:
      - follow
      - subscribe
      - download
      - link in bio
      - scan
      - whatsapp
      - instagram
      - tiktok
      - facebook

edit:
  render_engine: remotion           # dual-variant overlays/endcards require Remotion
  output_duration_sec: [12, 60]
  short_video_threshold_sec: 75       # <= about 1 minute: keep full video, no smart slicing
  max_segments_per_source: 3
  segment_overlap_sec: 3
  layout_mode: original            # original | vertical
  aspect_ratio: "source"
  resolution: [1080, 1920]         # used only when layout_mode=vertical
  source_subtitle_cleanup: "ocr_blur"  # localized clips only; protected corners are excluded
  ocr_backend: auto                    # auto | tesseract | paddleocr
  source_subtitle_crop_bottom_ratio: 0.18
  ocr_use_fallback_regions: false
  ocr_auto_lower_third_fallback: false
  ocr_lower_third_fallback_regions:
    - [0.04, 0.04, 0.42, 0.20]
    - [0.0, 0.68, 1.0, 0.96]
  ocr_blur_sigma: 52
  default_segment_strategy: auto

localization:
  target: pt-BR
  asr_enabled: true
  chinese_audio_detection_enabled: true
  chinese_audio_detection_model: tiny
  chinese_audio_threshold: 3
  whisper_model: tiny
  voice_enabled: true                  # only Bilibili/Douyin Chinese narration is replaced with pt-BR voice
  tts_provider: auto                 # edge -> local system voice fallback
  edge_tts_voice: pt-BR-AntonioNeural # energetic Brazilian Portuguese male voice
  speech_style: excited_sports_male
  preserve_backing_track: true      # Bilibili/Douyin localized clips must keep separated no-vocals backing
  require_backing_track: true
  tts_voice: energetic_male
  tts_rate: 1.08
  # Hook variants for A/B testing; tracking.hook_version selects the active one
  # and is embedded in every UTM link as utm_content=<candidate-id>_<hook-version>.
  hooks:
    A: "Olha só o que aconteceu aqui."
    B: "Você precisa ver isso até o final."
  pyvideotrans:
    enabled: true
    project_dir: workspace/external_tools/pyvideotrans
    uv_bin: ~/.local/bin/uv
    timeout_sec: 900
    stt_enabled: false
    sts_enabled: false
    tts_enabled: false
    vtv_enabled: false
    recogn_type: 0
    model_name: tiny
    detect_language: auto
    translate_type: 0
    source_language_code: auto
    target_language_code: pt
    tts_type: 0
    voice_role: pt-BR-AntonioNeural
    voice_rate: "+8%"
    voice_autorate: true

audio:
  # auto: only Bilibili/Douyin Chinese narration is localized; all other source audio is preserved.
  source_mode: auto                 # auto | localize | preserve
  source_music_volume: 1.0
  voice_volume: 1.0
  bgm_volume: 0.0                  # fixed BGM is disabled; pt-BR localization uses generated voice only
  bgm_dir: assets/bgm
  bgm_path: ""

remotion:
  render_runner: cli
  promo_duration_sec: 1.5
  overlay_max_width_ratio: 0.18
  mobile_overlay_left_width_ratio: 0.22
  mobile_overlay_right_width_ratio: 0.36
  overlay_margin_h_ratio: 0.03
  overlay_margin_v_ratio: 0.05
  dual_variant:
    enabled: true
    generic_label: 通用版
    facebook_label: FB版
    tu_yi: assets/brand/overlay_tu_yi.jpg
    tu_er: assets/brand/overlay_tu_er.png
    lv_tu: assets/brand/endcard_portrait_green_v2.png
    lan_tu: assets/brand/endcard_landscape_blue_v2.png
  add_bgm_under_source: false
  content_bgm_volume: 0.0
  endcard_bgm_volume: 0.0
  captions:
    enabled: true
    variants: [通用版]
    position: bottom
    max_width_ratio: 0.82
    font_size_ratio: 0.052
    background_opacity: 0.74
    max_lines: 2
    text_color: "#ffffff"
    background_color: "#050505"
    accent_color: "#f2d14b"
  top_badge: ""
  bottom_headline: ""
  bottom_subline: ""
  endcard_cta: ""

hyperframes:
  enabled: false
  variant_label: HF包装版
  project_dir: hyperframes
  allow_external_render: false

aspect_thresholds:
  vertical_min: 0.5
  vertical_max: 0.75
  horizontal_min: 1.6
  horizontal_max: 1.9

mobile_review_format:
  enabled: true
  target_aspect: "3:4"
  target_resolution: [1080, 1440]
  landscape_min_aspect: 1.2
  background: "#000000"

brand:
  default_cta: https://copa.jarg.top/
  default_kit: jaguartv
  kits:
    jaguartv:
      watermark:
        mode: image            # image | text
        image: assets/brand/logo.png
        text: "Jaguar TV"      # fallback when image missing
        position: top_left     # top_left | top_right | bottom_left | bottom_right
        opacity: 0.92
        width: 170
      cover:
        mode: frame            # frame | image
        image: ""              # mode=image: server path or project-relative image
      endcard:
        mode: orientation_image        # generated | image | orientation_image
        image: ""              # mode=image: full-frame 1080x1920 PNG
        portrait_image: assets/brand/endcard_portrait_green_v2.png
        landscape_image: assets/brand/endcard_landscape_blue_v2.png
        title: "Jaguar TV"
        tagline: "O melhor app de TV ao vivo e esportes"
        site: "Jarg.top"
        duration_sec: 1.5
        background: "#04220E"
        accent: "#8CE522"
        features:
          - ["Anti-Freeze", "Estabilidade máxima em dias de jogos"]
          - ["4K Real", "A definição mais nítida do mercado"]
          - ["Futebol Total", "Canais premium 100% liberados"]
          - ["Sinal Raiz", "Servidores dedicados, sem intermediários"]

