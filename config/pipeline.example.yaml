run:
  timezone: Asia/Shanghai
  output_language: pt-BR
  discovery_limit: 500
  download_limit: 50
  production_limit: 10

sources:
  enabled: [youtube, bilibili, douyin, xiaohongshu, tiktok, facebook, x, instagram, kwai]
  exclude_languages: []
  keywords_file: config/keywords.example.yaml
  creators_file: config/creators.example.yaml
  adapters:
    youtube:
      cookies_file: ""
      cookies_from_browser: ""
      js_runtime: ""
      impersonate: ""
    bilibili:
      cookies_file: ""
      cookies_from_browser: ""
      js_runtime: ""
      impersonate: ""
    tiktok:
      cookies_file: ""
      cookies_from_browser: ""
      js_runtime: ""
      impersonate: auto
    facebook:
      cookies_file: ""
      cookies_from_browser: ""
      js_runtime: ""
      impersonate: auto
    x:
      cookies_file: ""
      cookies_from_browser: ""
      js_runtime: ""
      impersonate: auto
    instagram:
      cookies_file: ""
      cookies_from_browser: ""
      js_runtime: ""
      impersonate: auto
    kwai:
      cookies_file: ""
      cookies_from_browser: ""
      js_runtime: ""
      impersonate: auto
    douyin:
      api_base: http://127.0.0.1:8000
      binary: workspace/tool_venvs/f2/bin/f2
      config_file: ""
    xiaohongshu:
      api_base: http://127.0.0.1:5556

selection:
  min_score: 75
  max_source_duration_sec: 600
  min_height: 720
  duplicate_threshold: 0.90

edit:
  render_engine: remotion
  output_duration_sec: [12, 60]
  max_segments_per_source: 3
  segment_overlap_sec: 3
  layout_mode: original
  aspect_ratio: "9:16"
  resolution: [1080, 1920]
  variants_per_source: 2
  original_subtitle_strategy: [inpaint, blur, preserve_and_flag]
  source_subtitle_cleanup: ocr_blur
  ocr_backend: auto
  ocr_use_fallback_regions: false
  ocr_auto_lower_third_fallback: false
  ocr_blur_sigma: 52

localization:
  target: pt-BR
  asr_enabled: true
  chinese_audio_detection_enabled: true
  chinese_audio_detection_model: tiny
  chinese_audio_threshold: 3
  whisper_model: small
  voice_enabled: true
  tts_provider: auto
  edge_tts_voice: pt-BR-AntonioNeural
  preserve_backing_track: true
  require_backing_track: true
  tts_voice: energetic_male
  tts_rate: 1.05
  max_subtitle_chars_per_line: 36
  pyvideotrans:
    enabled: false
    project_dir: workspace/external_tools/pyvideotrans
    uv_bin: ~/.local/bin/uv
    timeout_sec: 900
    stt_enabled: false
    sts_enabled: false
    tts_enabled: false
    vtv_enabled: false
    recogn_type: 0
    model_name: tiny
    detect_language: auto
    translate_type: 0
    source_language_code: auto
    target_language_code: pt
    tts_type: 0
    voice_role: pt-BR-AntonioNeural
    voice_rate: "+8%"
    voice_autorate: true

brand:
  logo: assets/brand/logo.png
  end_card: assets/brand/end-card.mp4
  default_cta: https://copa.jarg.top/

publishing:
  enabled: true
  timezone: America/Sao_Paulo
  copywriter:
    model: gpt-5.6-terra
    attempts: 3
    timeout_sec: 60
    retry_delay_sec: 0.75
  youtube_category_accounts:
    足球类: jaguartv_vivo
  accounts:
    jaguartv_vivo:
      platform: youtube
      label: jaguartv vivo
      channel_id: UC8gCZXc5wbnjuZeco7qbKug
      channel_key: 8gCZXc5wbnjuZeco7qbKug
      authorized_email: miirandapache@gmail.com
      daily_limit: 3
      schedule_times:
        - "11:00"
        - "15:30"
        - "19:00"
      allowed_source_platforms:
        - tiktok
        - douyin
        - facebook
        - bilibili
        - original
      blocked_source_platforms:
        - youtube
      content_tags:
        - 足球类
      default_privacy_status: public
      enabled: true

storage:
  provider: factory_server
  root: workspace/server_media
  poster_subdir: posters            # relative to storage.root; absolute/traversal paths are rejected
  public_base_url: https://factory.jarg.top/media
  max_upload_bytes: 2147483648
  upload_chunk_bytes: 8388608

features:
  posters: true

trends:
  enabled: true
  cron: "0 5 * * *"
  schedule_timezone: Asia/Shanghai
  geo: BR
  keywords: ["futebol Brasil"]
  top_n: 10
  source: google_trends
  scrapling_python: workspace/tool_venvs/scrapling/bin/python
  sync_keywords_group: google_trends_br_daily
  runtime_keywords_file: workspace/runtime/keywords.trends.yaml

compliance:
  require_verified_rights: false
  mode: manual_review

reaction:
  default_mode: none
  modes: [none, picture_in_picture, split_vertical, side_by_side]
  source_volume: 0.72
  reaction_volume: 1.0

workers:
  discovery: 6
  download: 3
  analysis: 2
  render: 1

youtube_analytics:
  poll_interval_minutes: 60
  channel_import_interval_minutes: 60
  batch_size: 50
  backfill_rate_limit_per_minute: 6
