run:
  timezone: Asia/Shanghai
  output_language: pt-BR
  discovery_limit: 500
  download_limit: 50
  production_limit: 10

sources:
  enabled: [youtube, bilibili, douyin, xiaohongshu, tiktok, facebook, x, instagram, kwai]
  exclude_languages: []
  keywords_file: config/keywords.example.yaml
  creators_file: config/creators.example.yaml
  adapters:
    youtube:
      cookies_file: ""
      cookies_from_browser: ""
      js_runtime: ""
      impersonate: ""
    bilibili:
      cookies_file: ""
      cookies_from_browser: ""
      js_runtime: ""
      impersonate: ""
    tiktok:
      cookies_file: ""
      cookies_from_browser: ""
      js_runtime: ""
      impersonate: auto
    facebook:
      cookies_file: ""
      cookies_from_browser: ""
      js_runtime: ""
      impersonate: auto
    x:
      cookies_file: ""
      cookies_from_browser: ""
      js_runtime: ""
      impersonate: auto
    instagram:
      cookies_file: ""
      cookies_from_browser: ""
      js_runtime: ""
      impersonate: auto
    kwai:
      cookies_file: ""
      cookies_from_browser: ""
      js_runtime: ""
      impersonate: auto
    douyin:
      api_base: http://127.0.0.1:8000
      binary: workspace/tool_venvs/f2/bin/f2
      config_file: ""
    xiaohongshu:
      api_base: http://127.0.0.1:5556

selection:
  min_score: 75
  max_source_duration_sec: 900
  min_height: 720
  duplicate_threshold: 0.90

edit:
  render_engine: remotion
  output_duration_sec: [12, 60]
  max_segments_per_source: 3
  segment_overlap_sec: 3
  layout_mode: original
  aspect_ratio: "9:16"
  resolution: [1080, 1920]

remotion:
  render_runner: cli

quality:
  visual:
    sample_fps: 2
    black_duration_sec: 1.0
    green_duration_sec: 1.0
    freeze_duration_sec: 3.0
    freeze_frame_delta: 1.2

localization:
  enabled: true
  target: pt-BR
  krillinai:
    project_dir: workspace/external_tools/KrillinAI
    binary: build/krillinai-cli
    revision: 17c87b0ce59ee937b0658994718c07b9ca98c1d1
    timeout_sec: 1800
    origin_language: auto
    target_language: pt
    caption_source: any
    max_words_per_line: 7
    voice: ""
    voice_pool: [pt-BR-AntonioNeural, pt-BR-FranciscaNeural]
    responses_bridge: false

brand:
  default_cta: https://copa.jarg.top/

publishing:
  enabled: true
  timezone: America/Sao_Paulo
  copywriter:
    model: gpt-5.6-terra
    attempts: 3
    timeout_sec: 60
    retry_delay_sec: 0.75
  youtube_category_accounts:
    足球类: jaguartv_vivo
  accounts:
    jaguartv_vivo:
      platform: youtube
      label: jaguartv vivo
      channel_id: UC8gCZXc5wbnjuZeco7qbKug
      channel_key: 8gCZXc5wbnjuZeco7qbKug
      authorized_email: miirandapache@gmail.com
      daily_limit: 3
      schedule_times:
        - "11:00"
        - "15:30"
        - "19:00"
      allowed_source_platforms:
        - tiktok
        - douyin
        - facebook
        - bilibili
        - original
      blocked_source_platforms:
        - youtube
      content_tags:
        - 足球类
      default_privacy_status: public
      enabled: true

storage:
  provider: factory_server
  root: workspace/server_media
  poster_subdir: posters            # relative to storage.root; absolute/traversal paths are rejected
  public_base_url: https://factory.jarg.top/media
  max_upload_bytes: 2147483648
  upload_chunk_bytes: 8388608

features:
  posters: true

trends:
  enabled: true
  cron: "10 0 * * *"
  schedule_timezone: America/Sao_Paulo
  geo: BR
  keywords: ["futebol Brasil"]
  top_n: 80
  top_n_per_category: 8
  source: multi_source_trends
  scrapling_python: workspace/tool_venvs/scrapling/bin/python
  sync_keywords_group: google_trends_br_daily
  runtime_keywords_file: workspace/runtime/keywords.trends.yaml
  sync_by_category: true
  excluded_categories:
    - 教程及优点展示类
    - 官方性质类
    - 合作类
    - 运营教学类
    - 教程及答疑类
  category_queries:
    ai短剧: ["AI short drama Brasil", "novela IA Brasil"]
    明星名人歌手: ["celebridades Brasil", "cantores famosos Brasil"]
    足球球星: ["jogadores brasileiros futebol", "Neymar Vini Jr Brasil"]
    足球类: ["futebol Brasil", "Brasileirão hoje"]
    新闻类: ["notícias Brasil hoje", "tendências Brasil"]
    音乐类: ["música viral Brasil", "funk sertanejo Brasil"]
    肥皂剧（电视剧、电影）: ["novelas Globo Brasil", "filmes séries Brasil"]
    少儿剧: ["conteúdo infantil Brasil", "desenho infantil Brasil"]
    纪录片（美食、动物、地区发展）: ["documentário Brasil comida natureza", "gastronomia Brasil"]
    综艺: ["reality show Brasil", "programa entretenimento Brasil"]
    社交挑战: ["TikTok Brasil viral", "desafio viral Brasil"]
    舞蹈: ["dança viral Brasil", "coreografia Brasil"]
  last30days:
    enabled: true
    skill_dir: workspace/external_tools/last30days-skill
    python: .venv/bin/python
    sources: reddit,youtube,hackernews,polymarket,grounding
    days: 30
    max_per_category: 4
    timeout_sec: 240
    auto_resolve: true
    save_dir: workspace/runtime/last30days
    topic_template: "{category} Brasil tendências {query}"
  agent_reach:
    enabled: true
    binary: workspace/tool_venvs/agent-reach/bin/agent-reach
    mcporter_binary: mcporter
    max_per_category: 4
    timeout_sec: 45
    doctor_timeout_sec: 20
    num_results: 5
    query_template: "Brazil {category} trending topics {query}"

compliance:
  require_verified_rights: false
  mode: manual_review

reaction:
  default_mode: none
  modes: [none, picture_in_picture, split_vertical, side_by_side]
  source_volume: 0.72
  reaction_volume: 1.0

workers:
  discovery: 6
  download: 3
  analysis: 2
  render: 1

youtube_analytics:
  poll_interval_minutes: 60
  channel_import_interval_minutes: 60
  batch_size: 50
  backfill_rate_limit_per_minute: 6
