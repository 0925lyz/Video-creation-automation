[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jaguartv-content-factory-vnext"
version = "0.2.0"
description = "Smart long-video slicing, Reaction rendering and server review pipeline for JaguarTV"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=11.0",
  "pandas>=2.2",
  "playwright>=1.45",
  "PyYAML>=6.0.2",
  "requests>=2.32",
  "yt-dlp[default,curl-cffi]>=2026.8.19",
]

[project.optional-dependencies]
design = ["opencv-python-headless>=4.10"]
test = ["pytest>=8.3"]

[project.scripts]
jaguartv = "jaguartv_factory.cli:main"

[tool.setuptools.package-data]
jaguartv_factory = [
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "remotion_template/package.json",
  "remotion_template/scripts/*.mjs",
  "remotion_template/src/*.tsx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
