<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · JaguarTV 内容工厂</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f5; color: #17211d; padding: 24px; }
    main { width: min(100%, 400px); background: #fff; border: 1px solid #dce3df; border-radius: 8px; padding: 32px; box-shadow: 0 18px 50px rgba(22, 49, 38, .09); }
    .brand { color: #087a55; font-size: 13px; font-weight: 800; text-transform: uppercase; }
    h1 { margin: 8px 0 8px; font-size: 27px; letter-spacing: 0; }
    p { margin: 0 0 24px; color: #66736d; line-height: 1.55; }
    label { display: grid; gap: 8px; font-weight: 700; font-size: 14px; }
    input { width: 100%; min-height: 48px; border: 1px solid #b8c4be; border-radius: 6px; padding: 0 13px; font: inherit; }
    input:focus { outline: 3px solid rgba(8, 122, 85, .16); border-color: #087a55; }
    button { width: 100%; min-height: 48px; margin-top: 16px; border: 0; border-radius: 6px; background: #087a55; color: white; font: inherit; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #message { min-height: 22px; margin: 14px 0 0; color: #b3261e; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">JaguarTV Content Factory</div>
    <h1>登录内容工厂</h1>
    <p>请输入管理员提供的 Dashboard 访问密码。</p>
    <form id="loginForm">
      <label>访问密码<input id="password" name="password" type="password" autocomplete="current-password" required autofocus></label>
      <button id="submitButton" type="submit">登录</button>
      <div id="message" role="alert" aria-live="polite"></div>
    </form>
  </main>
  <script>
    const form = document.querySelector("#loginForm");
    const button = document.querySelector("#submitButton");
    const message = document.querySelector("#message");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "";
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.querySelector("#password").value }),
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "登录失败");
        window.location.replace("/");
      } catch (error) {
        message.textContent = error.message || "登录失败";
        button.disabled = false;
        document.querySelector("#password").select();
      }
    });
  </script>
</body>
</html>
